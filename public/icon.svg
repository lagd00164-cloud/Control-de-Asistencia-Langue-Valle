<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001f54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0073CF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle for Samsung One UI -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Shield Shape -->
  <path d="M 256 90 L 370 145 C 370 265 256 360 256 370 C 256 360 142 265 142 145 Z" 
        fill="#001838" fill-opacity="0.7" stroke="url(#cyanGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Holographic Biometric ID Card silhouette -->
  <rect x="180" y="170" width="152" height="100" rx="12" fill="#002b5c" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="215" cy="215" r="22" fill="#00E5FF" fill-opacity="0.3" stroke="#00E5FF" stroke-width="2"/>
  <rect x="250" y="200" width="65" height="7" rx="3.5" fill="#00E5FF" fill-opacity="0.9"/>
  <rect x="250" y="215" width="45" height="6" rx="3" fill="#64B5F6" fill-opacity="0.8"/>
  <rect x="250" y="228" width="55" height="5" rx="2.5" fill="#90CAF9" fill-opacity="0.6"/>

  <!-- Checkmark / Biometric Verified Symbol -->
  <circle cx="256" cy="305" r="28" fill="#10B981" filter="url(#glow)"/>
  <path d="M 245 305 L 253 313 L 268 296" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Honduras 5 Stars accent (subtle top) -->
  <g fill="#00E5FF" opacity="0.8">
    <circle cx="256" cy="120" r="3"/>
    <circle cx="236" cy="115" r="2.5"/>
    <circle cx="276" cy="115" r="2.5"/>
    <circle cx="236" cy="128" r="2.5"/>
    <circle cx="276" cy="128" r="2.5"/>
  </g>

  <!-- Bottom Label -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="4">BIOCHECK HN</text>
</svg>
